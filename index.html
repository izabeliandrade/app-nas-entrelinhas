<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nas Entrelinhas</title>
  <meta name="description" content="Entre histórias, pensamentos e tudo aquilo que permanece. Um diário literário pessoal.">
  <meta name="theme-color" content="#F5F0E8" id="theme-color">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Entrelinhas">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // aplica o tema antes de pintar, evitando flash
    (function () {
      try {
        var t = localStorage.getItem('ne-theme') || 'auto';
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme-resolved', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Navegação principal">
      <a href="#/" data-nav="home"><span class="ic" data-icon="home"></span>Meu universo</a>
      <a href="#/estante" data-nav="estante"><span class="ic" data-icon="shelf"></span>Estante</a>
      <a href="#/diario" data-nav="diario"><span class="ic" data-icon="diary"></span>Diário</a>
      <a href="#/fragmentos" data-nav="fragmentos"><span class="ic" data-icon="quote"></span>Fragmentos</a>
      <a href="#/trajetoria" data-nav="trajetoria"><span class="ic" data-icon="path"></span>Trajetória</a>
    </nav>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:2rem;text-align:center">Ative o JavaScript para usar o Nas Entrelinhas.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
